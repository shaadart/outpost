name: Release candidate

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  device-tests:
    uses: ./.github/workflows/device-tests.yml

  build:
    needs: device-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify tests and lint before packaging
        run: ./gradlew testDebugUnitTest lintDebug --no-daemon
      - name: Configure release signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          required = ('SIGNING_KEY', 'ALIAS', 'KEY_STORE_PASSWORD', 'KEY_PASSWORD')
          if any(not os.environ.get(name) for name in required):
              raise SystemExit('Configure SIGNING_KEY, ALIAS, KEY_STORE_PASSWORD, and KEY_PASSWORD release secrets.')
          key_path = Path(os.environ['RUNNER_TEMP']) / 'outpost-release.jks'
          key_path.write_bytes(base64.b64decode(os.environ['SIGNING_KEY'], validate=True))
          key_path.chmod(0o600)
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace(' ', '\\ ')
          values = {'storeFile': str(key_path), 'keyAlias': os.environ['ALIAS'],
                    'storePassword': os.environ['KEY_STORE_PASSWORD'], 'keyPassword': os.environ['KEY_PASSWORD']}
          path = Path('keystore.properties')
          path.write_text(''.join(key + '=' + escape(value) + '\n' for key, value in values.items()))
          path.chmod(0o600)
          PY
      - name: Build signed release APKs
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify APK signatures
        run: |
          verifier=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$verifier"
          for apk in app/build/outputs/apk/release/*.apk; do
            "$verifier" verify "$apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: outpost-release-candidate
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/outpost-release.jks"
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/build/outputs/mapping/release/
